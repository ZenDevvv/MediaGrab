<!doctype html>
<html><head><title>Captioned sample</title></head>
<body>
<!-- An HTML5 video with a subtitle track: yt-dlp's generic extractor lists
     it as an "en" subtitle, so subtitle downloads can be tested offline. -->
<video controls src="sample.mp4">
  <track kind="subtitles" srclang="en" label="English" src="sample.en.vtt">
</video>
</body></html>
