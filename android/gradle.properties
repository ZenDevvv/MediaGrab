org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Required by the youtubedl-android composite build, which pulls in AGP 8.13.
# AGP refuses to load two versions in one build, so the app module has to
# match rather than the composite being pinned to ours.
android.suppressUnsupportedCompileSdk=35
