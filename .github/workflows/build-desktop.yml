name: Build Desktop Apps

# Tag-triggered so artifacts are only produced for real releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Bundle FFmpeg
        run: python packaging/fetch_ffmpeg.py

      - name: Build
        run: pyinstaller packaging/MediaGrab.spec --noconfirm --distpath dist --workpath build

      - name: Verify bundle completeness
        shell: pwsh
        run: |
          # A missing _internal folder produces an .exe that starts and dies.
          # Fail the build here rather than shipping it.
          $internal = "dist\MediaGrab\_internal"
          if (-not (Test-Path $internal)) { throw "Missing _internal directory" }
          $files = (Get-ChildItem $internal -Recurse -File)
          Write-Host "Bundle contains $($files.Count) files, $([math]::Round(($files | Measure-Object Length -Sum).Sum/1MB)) MB"
          if ($files.Count -lt 100) { throw "Bundle looks incomplete ($($files.Count) files)" }
          if (-not (Test-Path "$internal\ffmpeg\ffmpeg.exe")) {
            Write-Host "WARNING: bundled ffmpeg.exe missing; merge/MP3 will fail"
          }
          if (-not (Test-Path "dist\MediaGrab\MediaGrab.exe")) { throw "Executable missing" }

      - name: Smoke test backend starts
        shell: pwsh
        run: |
          $exe = "dist\MediaGrab\MediaGrab.exe"
          $out = "$env:RUNNER_TEMP\mediagrab.out.log"
          $err = "$env:RUNNER_TEMP\mediagrab.err.log"
          # Capture the child's streams. Without redirection a windowed
          # PyInstaller build writes its failure nowhere, and a startup crash
          # looks identical to a slow start.
          $p = Start-Process -FilePath $exe `
            -ArgumentList "--no-browser","--no-native","--port","8099" `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru

          # Poll rather than sleep-and-hope, mirroring the Linux step. A cold
          # Windows runner unpacks a large onedir bundle and imports yt-dlp,
          # which can outlast a fixed sleep.
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8099/api/capabilities" `
                -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Content -match '"desktop"') { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }

          if (-not $ok) {
            Write-Host "---- stdout ----"
            if (Test-Path $out) { Get-Content $out }
            Write-Host "---- stderr ----"
            if (Test-Path $err) { Get-Content $err }
            if ($p.HasExited) { Write-Host "Process exited with code $($p.ExitCode)" }
            else { Write-Host "Process still running but never served /api/capabilities" }
            throw "Windows backend failed to start"
          }

          try {
            # Proves yt-dlp's dynamically-imported extractors survived freezing,
            # which is the classic PyInstaller failure for yt-dlp.
            $i = Invoke-WebRequest -Uri "http://127.0.0.1:8099/api/info" -Method POST `
              -ContentType "application/json" -UseBasicParsing -TimeoutSec 45 `
              -Body '{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ"}'
            if ($i.Content -notmatch '"duration"') { throw "yt-dlp extractors not bundled correctly" }
            Write-Host "Smoke test passed (backend + yt-dlp extractors)"
          } finally {
            if (-not $p.HasExited) { $p.Kill() }
          }

      - name: Smoke test survives a no-console launch
        shell: pwsh
        run: |
          # Reproduces a double-click. v0.1.0 shipped a build that could not
          # start: the spec sets console=False, so the bootloader leaves
          # sys.stdout as None and uvicorn's logging config died on
          # sys.stdout.isatty(). The piped smoke test above could never catch
          # this -- Start-Process with -Redirect hands the child real file
          # handles, so its stdout is a valid stream. Launching with NO
          # redirection gives it none, exactly as a user launching it gets.
          $exe = "dist\MediaGrab\MediaGrab.exe"
          $p = Start-Process -FilePath $exe `
            -ArgumentList "--no-browser","--no-native","--port","8098" -PassThru

          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8098/api/capabilities" `
                -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Content -match '"desktop"') { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }

          if (-not $ok) {
            if ($p.HasExited) {
              Write-Host "Process exited with code $($p.ExitCode) -- no stdout/stderr redirect, so PyInstaller showed a traceback dialog."
            } else {
              Write-Host "Process still running but never served /api/capabilities"
            }
            throw "Windowed launch failed: the GUI build cannot initialise without valid stdio"
          }

          try { $null = Invoke-WebRequest -Uri "http://127.0.0.1:8098/api/capabilities" -UseBasicParsing -TimeoutSec 5 }
          finally { if (-not $p.HasExited) { $p.Kill() } }
          Write-Host "No-console launch passed"

      - name: Smoke test a real download
        shell: pwsh
        run: |
          # Startup smoke tests never download anything, so the whole download
          # path shipped unverified: v0.1.4 failed every desktop download with
          # "Output media file was not created".
          #
          # Serves the committed fixture rather than a real site. An earlier
          # version used YouTube and failed here because GitHub's datacenter
          # addresses trip the same bot check the hosted instance does; a test
          # that depends on a third party is not a test.
          $serve = Start-Process -FilePath "python" `
            -ArgumentList "-m","http.server","8096","--bind","127.0.0.1","--directory","tests/fixtures" `
            -PassThru -WindowStyle Hidden
          $exe = "dist\MediaGrab\MediaGrab.exe"
          $p = $null
          try {
            Start-Sleep -Seconds 2
            $p = Start-Process -FilePath $exe `
              -ArgumentList "--no-browser","--no-native","--port","8097" -PassThru

            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $c = Invoke-WebRequest -Uri "http://127.0.0.1:8097/api/capabilities" `
                  -UseBasicParsing -TimeoutSec 5
                if ($c.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "backend never became ready for the download test" }

            $body = @{
              url = "http://127.0.0.1:8096/sample.mp4"
              quality = "720p"
              mode = "mp4"
            } | ConvertTo-Json
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8097/api/download" -Method POST `
              -ContentType "application/json" -UseBasicParsing -TimeoutSec 60 -Body $body
            $job = ($r.Content | ConvertFrom-Json).job_id
            Write-Host "job $job submitted"

            $state = $null
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 2
              $j = Invoke-WebRequest -Uri "http://127.0.0.1:8097/api/progress/$job" `
                -UseBasicParsing -TimeoutSec 15
              $state = $j.Content | ConvertFrom-Json
              if ($state.status -eq "ready" -or $state.status -eq "error") { break }
            }
            if ($state.status -ne "ready") {
              Write-Host "progress payload: $($j.Content)"
              throw "Download smoke test failed (status=$($state.status))"
            }
            # The output template must keep the separator before the extension;
            # v0.1.4 produced "samplemp4".
            if (-not $state.filename.EndsWith(".mp4")) {
              throw "Malformed output filename: $($state.filename)"
            }
            Write-Host "Download smoke test passed: $($state.filename)"
          } finally {
            if ($p -and -not $p.HasExited) { $p.Kill() }
            if ($serve -and -not $serve.HasExited) { $serve.Kill() }
          }

      - name: Package
        run: |
          # PyInstaller builds an onedir layout: the .exe alone is NOT
          # runnable, it needs the sibling _internal folder. Attaching the bare
          # .exe produced a download that could not start, so ship a zip of the
          # whole bundle instead.
          Compress-Archive -Path dist/MediaGrab -DestinationPath MediaGrab-Windows.zip
          (Get-FileHash MediaGrab-Windows.zip -Algorithm SHA256).Hash.ToLower() `
            | Out-File -Encoding ascii MediaGrab-Windows.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-Windows
          path: |
            MediaGrab-Windows.zip
            MediaGrab-Windows.zip.sha256
          retention-days: 14

  linux:
    name: Linux (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 libwebkit2gtk-4.1-0 xvfb

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Bundle FFmpeg
        run: python packaging/fetch_ffmpeg.py

      - name: Build
        run: pyinstaller packaging/MediaGrab.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test backend starts
        run: |
          chmod +x dist/MediaGrab/MediaGrab
          ./dist/MediaGrab/MediaGrab --no-browser --port 8099 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8099/api/capabilities > /tmp/caps.json; then
              break
            fi
            sleep 1
          done
          grep -q '"desktop"' /tmp/caps.json || { echo "Unexpected capabilities payload"; cat /tmp/caps.json; exit 1; }
          test -x dist/MediaGrab/_internal/ffmpeg/ffmpeg || echo "WARNING: bundled ffmpeg missing"
          kill $PID
          echo "Smoke test passed"

      - name: Smoke test a real download
        run: |
          # Serves the committed fixture rather than a real site: GitHub's
          # datacenter addresses trip YouTube's bot check, so an earlier
          # version of this test failed for reasons unrelated to the code.
          chmod +x dist/MediaGrab/MediaGrab
          python3 -m http.server 8096 --bind 127.0.0.1 --directory tests/fixtures &
          SERVE=$!
          ./dist/MediaGrab/MediaGrab --no-browser --port 8097 &
          PID=$!
          trap 'kill $PID $SERVE 2>/dev/null || true' EXIT
          sleep 2

          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8097/api/capabilities > /dev/null; then
              ready=1; break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || { echo "backend never became ready"; exit 1; }

          JOB=$(curl -sf -X POST http://127.0.0.1:8097/api/download \
            -H 'Content-Type: application/json' \
            -d '{"url":"http://127.0.0.1:8096/sample.mp4","quality":"720p","mode":"mp4"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["job_id"])')
          echo "job $JOB submitted"

          status=""; filename=""
          for i in $(seq 1 90); do
            sleep 2
            payload=$(curl -sf "http://127.0.0.1:8097/api/progress/$JOB" || echo "{}")
            read -r status filename <<< "$(printf '%s' "$payload" | python3 -c \
              'import sys,json; d=json.load(sys.stdin); print(d.get("status",""), d.get("filename") or "")' \
              2>/dev/null || echo ' ')"
            case "$status" in ready|error) break ;; esac
          done

          if [ "$status" != "ready" ]; then
            curl -sf "http://127.0.0.1:8097/api/progress/$JOB" || true
            echo
            echo "Download smoke test failed (status=$status)"
            exit 1
          fi
          case "$filename" in
            *.mp4) echo "Download smoke test passed: $filename" ;;
            *) echo "Malformed output filename: $filename"; exit 1 ;;
          esac

      - name: Package tarball
        run: |
          tar -czf MediaGrab-Linux-x86_64.tar.gz -C dist MediaGrab
          sha256sum MediaGrab-Linux-x86_64.tar.gz > MediaGrab-Linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-Linux
          path: |
            MediaGrab-Linux-x86_64.tar.gz
            MediaGrab-Linux-x86_64.tar.gz.sha256
          retention-days: 14

  # Publishing is gated on every build and every verification passing.
  #
  # v0.1.0 published a release containing only the Linux tarball: each job
  # created the release itself, so the Linux job succeeded and shipped while
  # the Windows job failed. Nobody had to be told -- the download button simply
  # pointed at a build that could not start. Attaching from a single job that
  # `needs` both means an unverified build is never published.
  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify every expected asset is present
        run: |
          missing=0
          for f in MediaGrab-Windows.zip MediaGrab-Windows.zip.sha256 \
                   MediaGrab-Linux-x86_64.tar.gz MediaGrab-Linux-x86_64.tar.gz.sha256; do
            if [ ! -f "dist/$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          ls -la dist
          [ "$missing" -eq 0 ] || { echo "Refusing to publish an incomplete release"; exit 1; }

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true