name: Android

# The Kotlin half of the /api/ contract. Runs on every push and pull request
# because the Android server is a second implementation of the same eleven
# endpoints the Python app serves, and nothing else would catch drift between
# them -- see MULTI_PLATFORM_IMPLEMENTATION_PLAN.md §1.8 Decision #31.
on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Android contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # dev/sync-contract.py imports the FastAPI app, which transitively
        # imports yt-dlp, so it needs the full requirements rather than a
        # subset. Installing fastapi alone is faster and wrong: app.main pulls
        # in the downloader, so the import fails later and further from the
        # cause.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the Android SDK
        # The same script developers run, rather than android-actions/setup-android.
        #
        # That action fails on current runners: it shells out to a bundled
        # cmdline-tools 16.0 and asks it for a package named "tools", which no
        # longer exists in modern SDK releases --
        #   "Warning: Failed to find package 'tools'"
        #   sdkmanager failed with exit code 1
        # One source of truth for how the toolchain is installed is also worth
        # more than saving a dependency: if this ever diverges from what works
        # locally, CI stops being evidence of anything.
        run: bash dev/setup-android.sh

      - name: Load the toolchain
        run: |
          source .toolchain/env.sh
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Must be written too, not just ANDROID_HOME. GitHub's ubuntu images
          # predefine ANDROID_SDK_ROOT=/usr/local/lib/android/sdk, and Gradle
          # refuses to build when the two disagree:
          #   "Several environment variables and/or system properties contain
          #    different paths to the SDK"
          # Setting only one leaves the runner's value in place.
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> "$GITHUB_ENV"
          echo "$GRADLE_USER_HOME" >> "$GITHUB_PATH"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version
          ls "$ANDROID_HOME/platforms"

      - name: Verify the OpenAPI contract snapshot is current
        # Fails the build if the snapshot drifted, before spending minutes on a
        # compile that would be checking against a stale contract.
        run: python dev/sync-contract.py --check

      - name: Run the Kotlin unit tests
        # testDebugUnitTest, not connectedAndroidTest: the engine is behind an
        # interface, so the whole HTTP surface is exercised on the JVM against
        # real loopback. No emulator, no device, minutes instead of tens of
        # minutes.
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Assemble a debug APK
        # Proves the app still links, not just that its tests pass.
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7